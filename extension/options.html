<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SnapLoad settings</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 340px; padding: 16px; background: #0b0b10; color: #d6d6e0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 14px; color: #f4f4f8; margin-bottom: 4px; }
  p { color: #8f8fa3; font-size: 12px; margin-bottom: 12px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 10px; font-size: 13px;
    background: #15151d; color: #f4f4f8; border: 1px solid rgba(148,148,180,0.18);
    outline: none;
  }
  input:focus { border-color: #8b5cf6; }
  button {
    margin-top: 10px; width: 100%; padding: 9px; border: 0; border-radius: 10px;
    font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #8b5cf6, #d946ef);
  }
  #saved { margin-top: 8px; text-align: center; color: #34d399; font-size: 12px; visibility: hidden; }
</style>
</head>
<body>
  <h1>SnapLoad address</h1>
  <p>Where the extension sends videos. Leave as-is unless you run your own copy of SnapLoad.</p>
  <input id="base" type="url" placeholder="https://snapload.app" spellcheck="false" />
  <button id="save">Save</button>
  <p id="saved">Saved</p>
  <script type="module" src="options.js"></script>
</body>
</html>
